title: SSH Brute Force Keywords
id: 5e1d8f42-9a3b-4c7d-8e6f-0a1b2c3d4e5f
status: experimental
description: >
  Detects failed SSH authentication attempts in Linux syslog messages.
  Demonstrates keyword-based Sigma selections on non-HTTP log sources.
author: SOC Log Analyzer
date: 2024/03/15
logsource:
  service: syslog
detection:
  selection_ssh_fail:
    - 'Failed password'
    - 'Invalid user'
    - 'authentication failure'
  condition: selection_ssh_fail
level: medium
tags:
  - attack.credential_access
  - attack.t1110
